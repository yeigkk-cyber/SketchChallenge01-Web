		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #a5a5a5;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: cover;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		
#status {
  isolation: isolate;
  overflow: hidden;
  gap: clamp(8px, 1.5svh, 18px);
  background: #123454;
}
#status-backdrop {
  position: absolute;
  inset: -32px;
  z-index: -1;
  background-position: center;
  background-size: cover;
  filter: blur(32px) brightness(.65);
}
#status-splash.fullsize--true {
  position: relative;
  inset: auto;
  width: min(100%, calc(82svh * 2.07792));
  height: auto;
  max-height: none;
  margin: 0;
  flex: none;
  object-fit: cover;
  mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent),
              linear-gradient(to bottom, transparent, black 4%, black 94%, transparent);
  mask-composite: intersect;
}
#loading-controls {
  position: relative;
  width: min(72%, 470px);
  gap: clamp(5px, 1svh, 10px);
  text-align: center;
  color: #eff9ff;
  font: 650 clamp(13px, 2.1svh, 20px) system-ui;
  text-shadow: 0 2px 5px #0f2948;
}
#status-progress {
  display: block; position: static; width: 100%; height: clamp(9px, 1.6svh, 16px);
  box-sizing: border-box; appearance: none; border: 2px solid #a4d4f5;
  border-radius: 99px; overflow: hidden; background: #163d63; accent-color: #53b5ff;
}
#status-progress::-webkit-progress-bar { background: #163d63; }
#status-progress::-webkit-progress-value { background: linear-gradient(#ccf4ff,#2697ee); border-radius: 99px; }
#status-progress::-moz-progress-bar { background: linear-gradient(#ccf4ff,#2697ee); }
#status-notice { position: absolute; max-width: min(80%, 620px); }
[hidden] { display: none !important; }
#orientation-gate {
 position: fixed; inset: 0; z-index: 30000; display: grid; place-items: center;
 padding: max(24px, env(safe-area-inset-top)); background: linear-gradient(145deg,#178de4,#8ecbfa);
 color: #174b7a; font: 16px/1.7 system-ui, sans-serif; text-align: center;
}
.orientation-card { width: min(100%,380px); padding: 28px 22px; border: 3px solid white; border-radius: 26px; background: #f0faff; box-shadow: 0 8px 0 #4a9ed9; }
.orientation-phone { margin: 0 auto 18px; width: 76px; height: 42px; border: 3px solid #219bef; border-radius: 8px; position: relative; }
.orientation-phone::after { content: ''; position: absolute; right: 5px; top: 15px; width: 5px; height: 5px; border-radius: 50%; background: #219bef; }
.orientation-card h1 { font-size: 20px; margin: 0 0 12px; }
.orientation-card p { margin: 0 0 20px; }
#landscape-start, #install-app { border: 2px solid white; border-radius: 24px; background: #1c9ded; color: white; font: 600 16px/1.5 system-ui,sans-serif; min-height: 44px; padding: 10px 22px; cursor: pointer; box-shadow: 0 3px 0 #116fc0; }
#install-app { position: fixed; right: max(12px,env(safe-area-inset-right)); bottom: max(12px,env(safe-area-inset-bottom)); z-index: 31000; font-size: 14px; }
.portrait-blocked #canvas { visibility: hidden; pointer-events: none; }


#kitchen-text-dialog {position:fixed;inset:0;z-index:10000;background:#10274199;display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box;height:100dvh;font-family:system-ui,sans-serif;color:#164976}
#kitchen-text-dialog[hidden]{display:none}
#kitchen-text-dialog form {width:min(520px,100%);max-height:calc(100dvh - 20px);overflow:auto;box-sizing:border-box;padding:16px;border:2px solid #8bd6ff;border-radius:18px;background:#f3fbff;box-shadow:0 5px 0 #4c9fd0}
#kitchen-text-dialog label{display:block;margin-bottom:8px;font-size:18px}
#kitchen-text-dialog input,#kitchen-text-dialog textarea{box-sizing:border-box;width:100%;min-height:48px;padding:10px;font:20px system-ui;border:1px solid #96c9ed;border-radius:10px;background:white;color:#163c61}
#kitchen-text-dialog textarea{height:100px;resize:vertical}
#kitchen-text-dialog .actions,#kitchen-text-dialog .directions{display:flex;gap:8px;margin-top:10px}
#kitchen-text-dialog button{flex:1;min-height:44px;border:1px solid #8fbde5;border-radius:12px;background:#fff;color:#164976;font:17px system-ui}
#kitchen-text-dialog button[type=submit],#kitchen-text-dialog button[aria-pressed=true]{background:#1598e7;color:white}
</style>

<section id="orientation-gate" hidden role="dialog" aria-modal="true" aria-labelledby="orientation-title"><div class="orientation-card"><div class="orientation-phone" aria-hidden="true"></div><h1 id="orientation-title">ဖုန်းကို အလျားလိုက်လှည့်ပါ</h1><p>横向きでプレイしてください<br>Play in landscape</p><button id="landscape-start">ဂိမ်းစမယ် · Start</button></div></section>
<button id="install-app" hidden>Install app</button>
<script id="mobile-app">
(() => {
  'use strict';
  const gate = document.getElementById('orientation-gate');
  const enter = document.getElementById('landscape-start');
  const install = document.getElementById('install-app');
  const canvas = document.getElementById('canvas');
  const coarse = matchMedia('(pointer: coarse)');
  const portrait = matchMedia('(orientation: portrait)');
  const standalone = matchMedia('(display-mode: standalone)');
  const fullscreen = matchMedia('(display-mode: fullscreen)');
  let promptEvent = null;
  let entering = false;
  const waiting = [];
  const mobile = () => coarse.matches || navigator.userAgentData?.mobile === true || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const installed = () => standalone.matches || fullscreen.matches || navigator.standalone === true;
  function update() {
    const blocked = mobile() && portrait.matches;
    gate.hidden = !blocked;
    canvas.inert = blocked;
    canvas.setAttribute('aria-hidden', String(blocked));
    document.body.classList.toggle('portrait-blocked', blocked);
    if (!blocked) waiting.splice(0).forEach(resolve => resolve());
    if (installed()) install.hidden = true;
  }
  async function lock() {
    if (mobile() && screen.orientation?.lock) {
      try { await screen.orientation.lock('landscape'); } catch (_) { /* The rotate gate remains if the browser disallows locking. */ }
    }
    update();
  }
  async function enterLandscape() {
    if (!mobile() || entering) return;
    entering = true;
    try {
      if (!installed() && !document.fullscreenElement && document.documentElement.requestFullscreen) {
        try { await document.documentElement.requestFullscreen(); } catch (_) { /* Manual rotation remains available. */ }
      }
      await lock();
    } finally { entering = false; }
  }
  window.KitchenMobile = {
    whenLandscape: () => (!mobile() || !portrait.matches) ? Promise.resolve() : new Promise(resolve => waiting.push(resolve)),
  };
  enter.addEventListener('click', enterLandscape);
  document.addEventListener('pointerdown', event => {
    if (!event.target.closest('#kitchen-text-dialog') && event.target !== install && !install.contains(event.target)) enterLandscape();
  }, {capture:true});
  portrait.addEventListener('change', update);
  coarse.addEventListener('change', update);
  window.addEventListener('resize', update);
  document.addEventListener('fullscreenchange', lock);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) lock(); });
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    promptEvent = event;
    install.hidden = installed();
  });
  install.addEventListener('click', async () => {
    if (!promptEvent) return;
    const event = promptEvent;
    promptEvent = null;
    install.hidden = true;
    await event.prompt();
    await event.userChoice;
  });
  window.addEventListener('appinstalled', () => { promptEvent = null; install.hidden = true; });
  update();
  // Installed Android apps honor the manifest; fullscreen permission is requested
  // on the first browser tap when a user gesture is required.
  lock();
})();

</script>
		
<script>
(() => {
 const host=document.createElement('div');host.id='kitchen-text-dialog';host.hidden=true;host.setAttribute('role','dialog');host.setAttribute('aria-modal','true');
 host.innerHTML='<form><label for="kitchen-native-field"></label><input id="kitchen-native-field" autocomplete="off"><textarea hidden aria-label="Answer"></textarea><div class="directions" hidden></div><div class="actions"><button type="button" class="cancel"></button><button type="submit">OK</button></div></form>';
 document.body.append(host);
 const fitKeyboard=()=>{if(window.visualViewport){host.style.top=visualViewport.offsetTop+'px';host.style.height=visualViewport.height+'px';}};
 window.visualViewport?.addEventListener('resize',fitKeyboard);window.visualViewport?.addEventListener('scroll',fitKeyboard);fitKeyboard();
 const form=host.querySelector('form'),single=host.querySelector('input'),multi=host.querySelector('textarea'),directions=host.querySelector('.directions');
 let active=null,composing=false;
 const normalize=value=>value.replace(/[၀-၉]/g,c=>String(c.charCodeAt(0)-0x1040)).replace(/[０-９]/g,c=>String(c.charCodeAt(0)-0xff10)).replace(/．/g,'.');
 function close(confirmed){if(!active)return;const state=active;active=null;host.hidden=true;state.field.blur();state.callback(state.numeric?normalize(state.field.value):state.field.value,confirmed,state.axis);document.getElementById('canvas').focus();}
 for(const field of [single,multi]){field.addEventListener('compositionstart',()=>composing=true);field.addEventListener('compositionend',()=>composing=false);field.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close(false);}if(e.key==='Enter'&&(e.isComposing||composing||e.keyCode===229)){e.preventDefault();e.stopPropagation();}});}
 form.addEventListener('submit',e=>{e.preventDefault();if(!composing)close(true);});
 host.querySelector('.cancel').addEventListener('click',()=>close(false));
 host.addEventListener('pointerdown',e=>{if(e.target===host)close(false);});
 window.KitchenTextInput={
  open(owner,hint,value,numeric,axis,language,callback,multiline=false){
   if(active)close(false);composing=false;
   single.hidden=!!multiline;multi.hidden=!multiline;
   const field=multiline?multi:single;
   field.value=value;field.inputMode=numeric?'decimal':'text';single.type='text';field.placeholder=hint;
   host.querySelector('label').textContent=hint;host.setAttribute('aria-label',hint);
   host.querySelector('.cancel').textContent=['キャンセル','မလုပ်တော့ပါ','Cancel'][language]||'Cancel';
   active={owner,field,numeric,axis,callback};directions.hidden=axis<0;directions.replaceChildren();
   ['→','↓','←','↑'].forEach((text,index)=>{const b=document.createElement('button');b.type='button';b.textContent=text;b.setAttribute('aria-pressed',String(index===axis));b.onclick=()=>{active.axis=index;for(const c of directions.children)c.setAttribute('aria-pressed',String(c===b));};directions.append(b);});
   host.hidden=false;field.focus();field.select();
  },
  closeOwner(owner){if(active?.owner===owner)close(false);}
 };
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":23865892,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
// Finish cache activation before gameplay so an installed app does not keep old UI.
const kitchenCacheReady = (async () => {
 if (!('serviceWorker' in navigator) || !GODOT_CONFIG.serviceWorker) return;
 try {
  const registration=await navigator.serviceWorker.register(GODOT_CONFIG.serviceWorker,{updateViaCache:'none'});
  if (!registration?.addEventListener) return;
  await Promise.race([registration.update().catch(()=>{}),new Promise(resolve=>setTimeout(resolve,4000))]);
  const worker=registration.waiting || registration.installing;
  if (!worker) return;
  await Promise.race([new Promise(resolve=>{
   const activate=()=>{if(worker.state==='installed')worker.postMessage('claim');if(worker.state==='activated'||worker.state==='redundant')resolve();};
   worker.addEventListener('statechange',activate);activate();
  }),new Promise(resolve=>setTimeout(resolve,5000))]);
  if(worker.state==='activated' && navigator.serviceWorker.controller && sessionStorage.getItem('kitchen-cache-build')!=='a3647b025084b94350d9dd479e982978de08222a'){
   sessionStorage.setItem('kitchen-cache-build','a3647b025084b94350d9dd479e982978de08222a');location.reload();await new Promise(()=>{});
  }
 } catch(error){console.warn('App cache registration:',error);}
})();

(function () {
	const statusOverlay = document.getElementById('status');
	document.getElementById('status-backdrop').style.backgroundImage = 'url(' + document.getElementById('status-splash').src + ')';
	const statusProgress = document.getElementById('status-progress');
	const loadingControls = document.getElementById('loading-controls');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		loadingControls.style.display = mode === 'progress' ? 'grid' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		const engine = new Engine(GODOT_CONFIG);
		Promise.all([window.KitchenMobile.whenLandscape(),kitchenCacheReady]).then(() => engine.startGame({
			canvas: document.getElementById('canvas'),
			onProgress(current, total) {
				if (total > 0) statusProgress.max = total;
				statusProgress.value = current;
			}
		})).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
