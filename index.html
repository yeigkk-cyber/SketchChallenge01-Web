		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #a5a5a5;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: cover;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		
#status {
  isolation: isolate;
  overflow: hidden;
  gap: clamp(8px, 1.5svh, 18px);
  background: #123454;
}
#status-backdrop {
  position: absolute;
  inset: -32px;
  z-index: -1;
  background-position: center;
  background-size: cover;
  filter: blur(32px) brightness(.65);
}
#status-splash.fullsize--true {
  position: relative;
  inset: auto;
  width: min(100%, calc(82svh * 2.07792));
  height: auto;
  max-height: none;
  margin: 0;
  flex: none;
  object-fit: contain;
  mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent),
              linear-gradient(to bottom, transparent, black 4%, black 94%, transparent);
  mask-composite: intersect;
}
#loading-controls {
  position: relative;
  width: min(72%, 470px);
  gap: clamp(5px, 1svh, 10px);
  text-align: center;
  color: #eff9ff;
  font: 650 clamp(13px, 2.1svh, 20px) system-ui;
  text-shadow: 0 2px 5px #0f2948;
}
#status-progress {
  display: block; position: static; width: 100%; height: clamp(9px, 1.6svh, 16px);
  box-sizing: border-box; appearance: none; border: 2px solid #a4d4f5;
  border-radius: 99px; overflow: hidden; background: #163d63; accent-color: #53b5ff;
}
#status-progress::-webkit-progress-bar { background: #163d63; }
#status-progress::-webkit-progress-value { background: linear-gradient(#ccf4ff,#2697ee); border-radius: 99px; }
#status-progress::-moz-progress-bar { background: linear-gradient(#ccf4ff,#2697ee); }
#status-notice { position: absolute; max-width: min(80%, 620px); }
</style>

306b\u9032\u307f\u307e\u3059\u3002\", \" \u1019\u1000\u103c\u102c\u1001\u1004\u103a \u1014\u1031\u102c\u1000\u103a\u1021\u1006\u1004\u1037\u103a\u1000\u102d\u102f \u1006\u1000\u103a\u101e\u103d\u102c\u1038\u1015\u102b\u1019\u101a\u103a\u104b\", \" The next level starts shortly.\")\n\t_show_message(method_text)\n\t# Customer/result box exposes only the verdict; no AI feedback or answer hints.\n\tcustomer.show_result(verdict)\n\t_present_result(\"correct\" if verdict[\"ok\"] else \"incorrect\")\n\tif verdict[\"ok\"]:\n\t\t_complete_level()\n\t\tbusy = true\n\t\tok_button.disabled = true\n\t\tanswer_box.editable = false\n\t\tclear_button.disabled = true\n\t\t%ActiveLanguage.disabled = true\n\t\t%RestartButton.disabled = true\n\t\tmenu_button.disabled = true\n\t\t_refresh_level_selector()\n\t\tawait get_tree().create_timer(0.9).timeout\n\t\tif is_inside_tree():\n\t\t\t_show_level_complete()\n\nfunc _on_speech_finished(kind: String) -> void:\n\tif kind != \"feedback\":\n\t\treturn\n\tif advance_pending:\n\t\tawait get_tree().create_timer(0.8).timeout\n\t\tif is_inside_tree() and advance_pending:\n\t\t\tadvance_pending = false\n\t\t\t_show_level_complete()\n\telif retry_drawing_pending:\n\t\tok_button.disabled = false\n\telif clear_sketch_on_error and busy and canvas:\n\t\tawait get_tree().create_timer(1.5).timeout\n\t\tcanvas.clear_all()\n\t\tbusy = false\n\nfunc _show_level_complete() -> void:\n\tLevelComplete.present(self, stage + 1, language_option.selected, _advance_stage)\n\nfunc _advance_stage() -> void:\n\tadvance_pending = false\n\t%ActiveLanguage.disabled = false\n\t%RestartButton.disabled = false\n\tmenu_button.disabled = false\n\tif stage == 1 and Progress.is_level_unlocked(3):\n\t\tProgress.set_language([\"jp\", \"mm\", \"en\"][language_option.selected])\n\t\tget_tree().change_scene_to_file(\"res://stage_3.tscn\")\n\t\treturn\n\tif stage + 1 >= stage_layers.size():\n\t\tcustomer.say_notice(final_notice[0], final_notice[1])\n\t\tbusy = false\n\t\treturn\n\tvar old := current\n\tvar fade := create_tween()\n\tfade.tween_property(old, \"modulate:a\", 0.0, 0.4)\n\tawait fade.finished\n\told.hide()\n\t_show_stage(stage + 1)\n\tclear_button.disabled = stage >= 2\n\tok_button.disabled = stage >= 2\n\tbusy = false\n\t_refresh_level_selector()\n\tvar line: Array = stage_questions[stage]\n\tcustomer.clear_conversation()\n\tcustomer.say_notice(line[0], line[1])\n\tif canvas == null:\n\t\tanswer_box.grab_focus()\n\n# ---------- session controls and progress ----------\nfunc _ui(jp: String, my: String, en: String) -> String:\n\treturn [jp, my, en][language_option.selected]\n\nfunc _on_language_selected(index: int) -> void:\n\tlanguage_option.select(index)\n\t%ActiveLanguage.select(index)\n\tget_tree().set_meta(\"kitchen_language\", index)\n\tcustomer.switch_language(index)\n\t_update_progress_ui()\n\tif not start_layer.visible:\n\t\tif not customer.intro_complete:\n\t\t\tstatus.text = _tr2([\"\u304a\u5ba2\u69d8\u306e\u8aac\u660e\u304c\u81ea\u52d5\u3067\u518d\u751f\u3055\u308c\u3066\u3044\u307e\u3059\u3002\", \"\u1016\u1031\u102c\u1000\u103a\u101e\u100a\u103a\u101b\u1032\u1037 \u101b\u103e\u1004\u103a\u1038\u1015\u103c\u1001\u103b\u1000\u103a\u1000\u102d\u102f \u1021\u101c\u102d\u102f\u1021\u101c\u103b\u1031\u102c\u1000\u103a \u1015\u103c\u1031\u102c\u1015\u103c\u1014\u1031\u1015\u102b\u1010\u101a\u103a\u104b\"])\n\t\telif busy and advance_pending:\n\t\t\t_show_message(_tr2(pass_text[mini(stage, pass_text.size() - 1)]))\n\t\telif retry_drawing_pending:\n\t\t\t_show_drawing_retry_hint()\n\t\telif not busy:\n\t\t\t_set_idle()\n\tif not feedback_kind.is_empty():\n\t\t_present_result(feedback_kind, false)\n\nfunc _load_progress() -> void:\n\thighest_level = Progress.get_highest_unlocked()\n\tcompleted_levels = 3 if Progress.stage3_completed else highest_level - 1\n\nfunc _complete_level() -> void:\n\tProgress.unlock_level(stage + 2)\n\tcompleted_levels = maxi(completed_levels, mini(stage + 1, PLAYABLE_LEVELS))\n\thighest_level = Progress.get_highest_unlocked()\n\t_update_progress_ui()\n\nfunc _launch_selected_stage() -> void:\n\tvar selected_stage := Progress.launch_stage\n\tProgress.launch_from_level_menu = false\n\tif selected_stage == 1:\n\t\t_begin_intro()\n\telse:\n\t\tif opening_tween and opening_tween.is_valid(): opening_tween.kill()\n\t\tstart_layer.hide()\n\t\tcurrent.hide()\n\t\tcustomer.intro_complete = true\n\t\t_show_stage(1, false)\n\t\tok_button.disabled = false\n\t\tclear_button.disabled = false\n\t\tcustomer.clear_conversation()\n\t\tcustomer.say_notice(stage_questions[1][0], stage_questions[1][1])\n\nfunc _open_stage_menu() -> void:\n\tif busy: return\n\tvar menu := preload(\"res://GameMenu.tscn\").instantiate()\n\tmenu.is_pause_overlay = true\n\tmenu.pause_level = stage + 1\n\tmenu.resume_requested.connect(func(): get_tree().paused = false; menu.queue_free())\n\tadd_child(menu)\n\tget_tree().paused = true\n\nfunc _update_progress_ui() -> void:\n\t_style_session_controls()\n\tif player_badge != null: player_badge.refresh(language_option.selected)\n\tif menu_button != null: menu_button.tooltip_text = _ui(\"\u30e1\u30cb\u30e5\u30fc\", \"\u1019\u102e\u1014\u1030\u1038\", \"Menu\")\n\t_refresh_level_selector()\n\t%ActiveLanguage.select(language_option.selected)\n\t_update_stage_hint()\n\t%ActiveLanguage.tooltip_text = _ui(\"\u8a00\u8a9e\u3092\u5909\u66f4\", \"\u1018\u102c\u101e\u102c\u1005\u1000\u102c\u1038 \u1015\u103c\u1014\u103a\u101b\u103d\u1031\u1038\u101b\u1014\u103a\", \"Change language\")\n\t_update_finish_label()\n\tstage_header.text = _ui(\"\u30ec\u30d9\u30eb %d\", \"\u1021\u1006\u1004\u1037\u103a %d\", \"Level %d\") % (stage + 1)\n\t%ActiveLanguage.text = _ui(\"\u8a00\u8a9e\", \"\u1018\u102c\u101e\u102c\u1005\u1000\u102c\u1038\", \"Language\")\n\t%RestartButton.text = \"\"\n\tvar level := stage + 1\n\t%RestartButton.show()\n\t%RestartButton.tooltip_text = _ui(\"\u30ec\u30d9\u30eb%d\u3092\u6700\u521d\u304b\u3089\", \"\u1021\u1006\u1004\u1037\u103a %d \u1000\u102d\u102f \u1021\u1005\u1000\u1015\u103c\u1014\u103a\u1005\u1019\u101a\u103a\", \"Restart Level %d\") % level\n\tstart_button.text = _ui(\"\u30b9\u30bf\u30fc\u30c8\", \"\u1005\u1010\u1004\u103a\u1019\u101a\u103a\", \"Start\")\n\nfunc _request_restart() -> void:\n\tmodern_restart.open(language_option.selected, stage + 1)\n\nfunc _restart_game() -> void:\n\tvar tree := get_tree()\n\tvar language := language_option.selected\n\tvar level := stage + 1\n\ttree.set_meta(\"kitchen_language\", language)\n\tvar result := tree.reload_current_scene()\n\tif result != OK:\n\t\tpush_error(\"Could not restart level: %s\" % error_string(result))\n\t\treturn\n\n\t# The new scene enters the current level directly with fresh scene state.\n\tProgress.launch_stage = level\n\tProgress.launch_from_level_menu = true\n\tif level == 3:\n\t\tProgress.launch_phase = 0\n\t\tProgress.restore_parts = false\n\t\tProgress.stage3_phase = 0\n\t\tProgress.stage3_solved.clear()\n\t\tProgress.stage3_completed = false\n\tProgress.set_language([\"jp\", \"mm\", \"en\"][language])\n\nfunc _play_opening() -> void:\n\t%StartPanel.modulate.a = 0.0\n\topening_tween = create_tween()\n\topening_tween.tween_property(%StartPanel, \"modulate:a\", 1.0, 0.7).set_trans(Tween.TRANS_SINE).set_ease(Tween.EASE_OUT)\n\nfunc _set_reference_guide(index: int) -> void:\n\t%ReferenceCanvas.get_node(\"NotchDimension\").set_guide_stage(index)\n\t%BigPlan.get_node(\"NotchDimension\").set_guide_stage(index)\n\nfunc _update_stage_hint() -> void:\n\tvar drawing_hint := _ui(\"\u30af\u30ea\u30c3\u30af\u3067\u63cf\u304f \u2022 \u9577\u3055\u3092\u5165\u529b \u2192 Enter \u2022 \u5b8c\u6210\u3057\u305f\u3089Finish\", \"\u1014\u103e\u102d\u1015\u103a\u1015\u103c\u102e\u1038\u1006\u103d\u1032\u1015\u102b \u2022 \u1021\u101b\u103e\u100a\u103a\u101b\u102d\u102f\u1000\u103a \u2192 Enter \u2022 \u1015\u103c\u102e\u1038\u101c\u103b\u103e\u1004\u103a Finish\", \"Click to draw \u2022 Type a length \u2192 Enter \u2022 Press Finish to check\")\n\tvar answer_hint := _ui(\"\u56de\u7b54\u3092\u5165\u529b\u3057\u3066OK\u3092\u62bc\u3057\u3066\u304f\u3060\u3055\u3044\u3002\", \"\u1021\u1016\u103c\u1031\u1000\u102d\u102f \u101b\u102d\u102f\u1000\u103a\u1011\u100a\u1037\u103a\u1015\u103c\u102e\u1038 OK \u1014\u103e\u102d\u1015\u103a\u1015\u102b\u104b\", \"Type your answer, then press OK.\")\n\t%DrawSubtitle.text = drawing_hint if stage == 0 else (answer_hint if stage == 1 else _ui(\"\u6e96\u5099\u4e2d\u3067\u3059\u3002\", \"\u1015\u103c\u1004\u103a\u1006\u1004\u103a\u1014\u1031\u1006\u1032 \u1016\u103c\u1005\u103a\u1015\u102b\u1010\u101a\u103a\u104b\", \"Coming soon.\"))\n\t%ControlsHelpButton.visible = stage == 0\n\t%ControlsHelpButton.tooltip_text = _ui(\"\u63cf\u304d\u65b9\", \"\u1015\u102f\u1036\u1006\u103d\u1032\u1014\u100a\u103a\u1038 \u1000\u103c\u100a\u1037\u103a\u101b\u1014\u103a\", \"Drawing controls\")\n\t%ControlsHelp.title = _ui(\"\u63cf\u304d\u65b9\", \"\u1015\u102f\u1036\u1006\u103d\u1032\u1014\u100a\u103a\u1038\", \"Drawing controls\")\n\t%ControlsHelp.dialog_text = _ui(\"\u30af\u30ea\u30c3\u30af\uff1a\u7dda\u306e\u59cb\u70b9\u30fb\u7d42\u70b9\\n\u6570\u5024\u3092\u5165\u529b \u2192 Enter\uff1a\u9577\u3055\u3092\u6307\u5b9a\uff08mm\uff09\\nShift\uff1a\u89d2\u5ea6\u306e\u5236\u7d04\u3092\u89e3\u9664\\n\u30c9\u30e9\u30c3\u30b0\uff1a\u70b9\u3092\u79fb\u52d5\\nUndo / Redo\uff1a\u53d6\u308a\u6d88\u3057 / \u3084\u308a\u76f4\u3057\\nZoom / Fit\uff1a\u62e1\u5927\u30fb\u7e2e\u5c0f / \u5168\u4f53\u8868\u793a\\n\u9752\u3044\u70b9\u7dda\u306e\u7bc4\u56f2\u3092\u63cf\u3044\u3066\u3001Finish\u3067\u78ba\u8a8d\u3057\u3066\u304f\u3060\u3055\u3044\u3002\", \"\u1014\u103e\u102d\u1015\u103a\u1001\u103c\u1004\u103a\u1038 \u2014 \u1019\u103b\u1009\u103a\u1038\u1021\u1005\u1014\u1032\u1037 \u1021\u1006\u102f\u1036\u1038\u1000\u102d\u102f \u101e\u1010\u103a\u1019\u103e\u1010\u103a\u1015\u102b\u104b\\n\u1021\u101b\u103e\u100a\u103a\u101b\u102d\u102f\u1000\u103a \u2192 Enter \u2014 \u1021\u1010\u102d\u1021\u1000\u103b \u1021\u101b\u103e\u100a\u103a\u1011\u100a\u1037\u103a\u1015\u102b (mm)\u104b\\nShift \u2014 \u1011\u1031\u102c\u1004\u1037\u103a\u1000\u1014\u1037\u103a\u101e\u1010\u103a\u1001\u103b\u1000\u103a\u1019\u101b\u103e\u102d\u1018\u1032 \u1006\u103d\u1032\u1015\u102b\u104b\\nDrag \u2014 \u1021\u1006\u102f\u1036\u1038\u1019\u103e\u1010\u103a\u1000\u102d\u102f \u101b\u103d\u103e\u1031\u1037\u1015\u102b\u104b\\nUndo / Redo \u2014 \u1014\u1031\u102c\u1000\u103a\u1015\u103c\u1014\u103a / \u1015\u103c\u1014\u103a\u101c\u102f\u1015\u103a\u1015\u102b\u104b\\nZoom / Fit \u2014 \u1001\u103b\u1032\u1037\u1000\u103c\u100a\u1037\u103a / \u1015\u102f\u1036\u1021\u1015\u103c\u100a\u1037\u103a\u1000\u103c\u100a\u1037\u103a\u1015\u102b\u104b\\n\u1021\u1015\u103c\u102c\u101b\u1031\u102c\u1004\u103a \u1019\u103b\u1009\u103a\u1038\u1015\u103c\u1010\u103a\u1018\u1031\u102c\u1004\u103a\u1021\u1010\u102d\u102f\u1004\u103a\u1038 \u1006\u103d\u1032\u1015\u103c\u102e\u1038 Finish \u1014\u1032\u1037 \u1005\u1005\u103a\u1015\u102b\u104b\", \"Click: place the start and end of a line.\\nType a length \u2192 Enter: set an exact length in mm.\\nShift: draw at a free angle.\\nDrag: move an endpoint.\\nUndo / Redo: undo or restore an edit.\\nZoom / Fit: inspect or fit the whole drawing.\\nDraw the blue dashed area, then press Finish to check.\")\n\n# ---------- clear, non-blocking answer feedback ----------\nfunc _present_result(kind: String, animate: bool = true) -> void:\n\tfeedback_kind = kind\n\tcustomer.set_result_hint(kind, animate)\n\nfunc _clear_result_feedback() -> void:\n\tfeedback_kind = \"\"\n\tcustomer.set_result_hint(\"\")\n\nfunc _answer_edited() -> void:\n\tif not busy and not feedback_kind.is_empty():\n\t\t_clear_result_feedback()\n\t\t_set_idle()\n\n# Explicit light dialog theme avoids dark OS/default backgrounds with dark inherited text.\nfunc _style_readable_dialog(dialog: AcceptDialog) -> void:\n\tvar palette := theme.duplicate() as Theme\n\tvar paper := StyleBoxFlat.new()\n\tpaper.bg_color = Color(\"ffffff\")\n\tpaper.border_color = Color(\"cbd5e1\")\n\tpaper.set_border_width_all(1)\n\tpaper.set_corner_radius_all(12)\n\tpaper.content_margin_left = 24\n\tpaper.content_margin_right = 24\n\tpaper.content_margin_top = 20\n\tpaper.content_margin_bottom = 20\n\tpalette.set_stylebox(\"panel\", \"AcceptDialog\", paper)\n\tvar frame := paper.duplicate() as StyleBoxFlat\n\tframe.border_width_top = 42\n\tframe.border_color = Color(\"e8eff9\")\n\tframe.expand_margin_top = 42\n\tpalette.set_stylebox(\"embedded_border\", \"Window\", frame)\n\tpalette.set_stylebox(\"embedded_unfocused_border\", \"Window\", frame)\n\tpalette.set_color(\"title_color\", \"Window\", Color(\"172b4d\"))\n\tpalette.set_color(\"title_unfocused_color\", \"Window\", Color(\"172b4d\"))\n\tpalette.set_font_size(\"title_font_size\", \"Window\", 20)\n\tpalette.set_constant(\"title_height\", \"Window\", 42)\n\tpalette.set_constant(\"title_outline_size\", \"Window\", 0)\n\tpalette.set_color(\"font_color\", \"Label\", Color(\"172b4d\"))\n\tpalette.set_font_size(\"font_size\", \"Label\", 18)\n\tpalette.set_constant(\"line_spacing\", \"Label\", 8)\n\tpalette.set_constant(\"buttons_separation\", \"AcceptDialog\", 16)\n\tdialog.theme = palette\n\tdialog.add_theme_stylebox_override(\"panel\", paper)\n\tdialog.borderless = false\n\tdialog.get_label().add_theme_color_override(\"font_color\", Color(\"172b4d\"))\n\tdialog.get_label().add_theme_font_size_override(\"font_size\", 18)\n\tdialog.get_label().autowrap_mode = TextServer.AUTOWRAP_WORD_SMART\n\tdialog.get_label().custom_minimum_size = Vector2(460, 108)\n\t_style_dialog_button(dialog.get_ok_button(), true)\n\tif dialog is ConfirmationDialog:\n\t\t_style_dialog_button(dialog.get_cancel_button(), false)\n\nfunc _style_dialog_button(button: Button, primary: bool) -> void:\n\tbutton.custom_minimum_size = Vector2(132, 44)\n\tbutton.add_theme_font_size_override(\"font_size\", 16)\n\tfor state in [\"normal\", \"hover\", \"pressed\", \"focus\"]:\n\t\tvar box := StyleBoxFlat.new()\n\t\tbox.set_corner_radius_all(8)\n\t\tbox.set_border_width_all(2 if state == \"focus\" else 1)\n\t\tbox.border_color = Color(\"2563eb\") if primary else Color(\"94a3b8\")\n\t\tbox.bg_color = (Color(\"1d4ed8\") if state == \"pressed\" else Color(\"2563eb\")) if primary else (Color(\"e2e8f0\") if state == \"hover\" else Color(\"f1f5f9\"))\n\t\tbox.content_margin_left = 18\n\t\tbox.content_margin_right = 18\n\t\tbox.content_margin_top = 8\n\t\tbox.content_margin_bottom = 8\n\t\tbutton.add_theme_stylebox_override(state, box)\n\tfor state in [\"font_color\", \"font_hover_color\", \"font_pressed_color\", \"font_focus_color\"]:\n\t\tbutton.add_theme_color_override(state, Color.WHITE if primary else Color(\"172b4d\"))\n\nfunc _style_drawing_workspace() -> void:\n\tvar panel := $Margin/Workspace/RightPanel as PanelContainer\n\tvar shell := _progress_box(\"dcecff\", \"a3c1e2\")\n\tshell.border_width_top = 5\n\tshell.border_color = Color.WHITE\n\tpanel.add_theme_stylebox_override(\"panel\", shell)\n\t%DrawTitle.add_theme_color_override(\"font_color\", Color(\"123968\"))\n\tvar ruler := ColorRect.new()\n\truler.color = Color.WHITE\n\truler.custom_minimum_size.y = 4\n\truler.mouse_filter = Control.MOUSE_FILTER_IGNORE\n\tvar toolbar := %Toolbar as Control\n\tvar layout := toolbar.get_parent()\n\tlayout.add_child(ruler)\n\tlayout.move_child(ruler, toolbar.get_index() + 1)\n\tfor button in [%DrawButton, %SelectButton, ok_button]:\n\t\tvar state := \"normal\" if button == ok_button else \"pressed\"\n\t\tvar selected := button.get_theme_stylebox(state).duplicate() as StyleBoxFlat\n\t\tselected.bg_color = Color(\"104db6\")\n\t\tselected.border_color = Color(\"36dafa\")\n\t\tselected.border_width_bottom = 3\n\t\tbutton.add_theme_stylebox_override(state, selected)\n\t\tif button != ok_button:\n\t\t\tbutton.add_theme_stylebox_override(\"hover_pressed\", selected)\n\nvar player_badge: Control\nvar menu_button: Button\n\nfunc _build_player_badge() -> void:\n\tvar header := %DrawTitle.get_parent()\n\theader.add_theme_constant_override(\"separation\", 14)\n\tplayer_badge = preload(\"res://PlayerBadge.gd\").new()\n\theader.add_child(player_badge)\n\theader.move_child(player_badge, header.get_child_count() - 2)\n\n\n# Keep translated labels from feeding their text size back into the workspace.\nfunc _reserve_label_space(label: Label, minimum: Vector2) -> void:\n\tvar parent := label.get_parent()\n\tvar index := label.get_index()\n\tvar slot := Control.new()\n\tslot.name = label.name + \"Slot\"\n\tslot.custom_minimum_size = minimum\n\tslot.size_flags_horizontal = label.size_flags_horizontal\n\tslot.size_flags_vertical = label.size_flags_vertical\n\tslot.clip_contents = true\n\tslot.mouse_filter = Control.MOUSE_FILTER_IGNORE\n\tparent.add_child(slot)\n\tparent.move_child(slot, index)\n\tlabel.reparent(slot, false)\n\tlabel.clip_text = true\n\tlabel.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)\n\nfunc _stabilize_workspace() -> void:\n\t# These slots have room for the taller Myanmar glyphs and wrapped hints.\n\t_reserve_label_space(stage_header, Vector2(110, 28))\n\t_reserve_label_space(%DrawSubtitle, Vector2(0, 36))\n\t_reserve_label_space(status, Vector2(250, 54))\n\t_reserve_label_space(%CustomerName, Vector2(0, 32))\n\t_reserve_label_space(%BubbleTitle, Vector2(0, 32))\n\t_reserve_label_space(player_badge.status_label, Vector2(104, 26))\n\t%ActiveLanguage.fit_to_longest_item = false\n\t%ActiveLanguage.clip_text = true\n\n\t# Keep requests readable as replies accumulate, even on a shorter viewport.\n\tvar layout := %CustomerCard.get_parent() as VBoxContainer\n\tvar parent := layout.get_parent()\n\tvar scroll := ScrollContainer.new()\n\tscroll.horizontal_scroll_mode = ScrollContainer.SCROLL_MODE_DISABLED\n\tparent.add_child(scroll)\n\tlayout.reparent(scroll, false)\n\tlayout.size_flags_horizontal = Control.SIZE_EXPAND_FILL\n\tlayout.size_flags_vertical = Control.SIZE_EXPAND_FILL\n\tcustomer.dialogue.fit_content = true\n\tcustomer.dialogue.scroll_active = false\n\nvar level_selector: OptionButton\nvar level_markers: Array[Button] = []\nvar progress_icons: Dictionary = {}\n\nfunc _build_level_selector() -> void:\n\tvar row := stage_header.get_parent() as HBoxContainer\n\tvar progress_row := %LevelProgressLabel.get_parent() as HBoxContainer\n\t%LevelProgress.hide()\n\n\tvar stove := '<g stroke=\"#153e67\" stroke-width=\"1.1\" stroke-linejoin=\"round\"><path fill=\"#a7c9e9\" d=\"M1 9v7l11 5 3-2 5 2 3-2v-7L14 8Z\"/><path fill=\"#fff\" d=\"M1 9l12-6 10 9-3 2-6-4-2 4Z\"/><path fill=\"#17314c\" d=\"m5 8 4-2 4 2-4 2Z\"/><path fill=\"none\" d=\"M12 14v7m8-7v7\"/></g>'\n\tvar lock := '<g transform=\"translate(6 4) scale(.55)\" fill=\"#ebf4fc\" stroke=\"#586d85\" stroke-width=\"2\"><path fill=\"none\" d=\"M7 11V7a5 5 0 0 1 10 0v4\"/><rect x=\"3\" y=\"9\" width=\"18\" height=\"13\" rx=\"3\"/><path d=\"M12 13v5\"/></g>'\n\tprogress_icons = {\n\t\t\"level\": _progress_icon(stove, 27),\n\t\t\"locked\": _progress_icon('<g opacity=\".35\">' + stove + '</g>' + lock, 18),\n\t\t\"unlocked\": _progress_icon(stove, 18),\n\t\t\"restart\": _progress_icon('<path fill=\"none\" stroke=\"#102e59\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M5 7h7a7 7 0 1 1-6.3 10M5 7l4-4M5 7l4 4\"/>', 19),\n\t\t\"language\": _progress_icon('<g fill=\"none\" stroke=\"#102e59\" stroke-width=\"1.7\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><ellipse cx=\"12\" cy=\"12\" rx=\"4\" ry=\"9\"/><path d=\"M3 12h18\"/></g>', 19),\n\t\t\"menu\": _progress_icon('<path fill=\"none\" stroke=\"#102e59\" stroke-width=\"2.4\" stroke-linecap=\"round\" d=\"M4 6h.1M4 12h.1M4 18h.1M9 6h11M9 12h11M9 18h11\"/>', 20),\n\t}\n\tvar badge := PanelContainer.new()\n\tvar badge_style := _progress_box(\"d4e7fa\", \"97bce1\")\n\tbadge_style.border_width_top = 4\n\tbadge_style.content_margin_left = 7\n\tbadge_style.content_margin_right = 7\n\tbadge.add_theme_stylebox_override(\"panel\", badge_style)\n\trow.add_child(badge)\n\trow.move_child(badge, 0)\n\tvar badge_row := HBoxContainer.new()\n\tbadge.add_child(badge_row)\n\tvar symbol := TextureRect.new()\n\tsymbol.texture = progress_icons[\"level\"]\n\tsymbol.size_flags_vertical = Control.SIZE_SHRINK_CENTER\n\tsymbol.mouse_filter = Control.MOUSE_FILTER_IGNORE\n\tbadge_row.add_child(symbol)\n\tstage_header.reparent(badge_row, false)\n\n\tmenu_button = Button.new()\n\tmenu_button.name = \"StageMenuButton\"\n\tmenu_button.icon = progress_icons[\"menu\"]\n\tmenu_button.pressed.connect(_open_stage_menu)\n\trow.add_child(menu_button)\n\t%RestartButton.icon = progress_icons[\"restart\"]\n\t%ActiveLanguage.icon = progress_icons[\"language\"]\n\n\t# Stage 3 uses the same scene and routes level changes through this selector.\n\tlevel_selector = OptionButton.new()\n\tfor index in range(PLAYABLE_LEVELS):\n\t\tlevel_selector.add_item(\"Level %d\" % (index + 1), index)\n\tlevel_selector.hide()\n\trow.add_child(level_selector)\n\tlevel_selector.item_selected.connect(_select_level)\n\n\tvar shelf := PanelContainer.new()\n\tvar shelf_style := _progress_box(\"d9e9fa\", \"a7c5e5\")\n\tshelf_style.border_color = Color(\"ffffff\")\n\tshelf_style.border_width_top = 5\n\tshelf_style.content_margin_top = 5\n\tshelf.add_theme_stylebox_override(\"panel\", shelf_style)\n\tvar layout := progress_row.get_parent()\n\tlayout.add_child(shelf)\n\tlayout.move_child(shelf, progress_row.get_index())\n\tprogress_row.reparent(shelf, false)\n\tprogress_row.add_theme_constant_override(\"separation\", 1)\n\tvar caption := %LevelProgressLabel as Label\n\tcaption.text = \"LEVEL REACH\"\n\tcaption.size_flags_horizontal = Control.SIZE_FILL\n\tcaption.add_theme_font_size_override(\"font_size\", 9)\n\tcaption.add_theme_color_override(\"font_color\", Color(\"123a69\"))\n\tfor index in range(DISPLAY_LEVELS):\n\t\tvar marker := Button.new()\n\t\tmarker.text = \"%02d\" % (index + 1)\n\t\tmarker.size_flags_horizontal = Control.SIZE_EXPAND_FILL\n\t\tmarker.custom_minimum_size.y = 28\n\t\tmarker.add_theme_font_override(\"font\", ThemeDB.fallback_font)\n\t\tmarker.add_theme_font_size_override(\"font_size\", 11)\n\t\tmarker.add_theme_constant_override(\"h_separation\", 1)\n\t\tfor state in [\"icon_normal_color\", \"icon_hover_color\", \"icon_pressed_color\", \"icon_focus_color\", \"icon_disabled_color\"]:\n\t\t\tmarker.add_theme_color_override(state, Color.WHITE)\n\t\tmarker.pressed.connect(func(): level_selector.item_selected.emit(index))\n\t\tlevel_markers.append(marker)\n\t\tprogress_row.add_child(marker)\n\nfunc _progress_icon(markup: String, extent: int) -> Texture2D:\n\tvar image := Image.new()\n\timage.load_svg_from_string('<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"%d\" height=\"%d\" viewBox=\"0 0 24 24\">%s</svg>' % [extent, extent, markup])\n\treturn ImageTexture.create_from_image(image)\n\nfunc _progress_box(fill: String, border: String) -> StyleBoxFlat:\n\tvar box := StyleBoxFlat.new()\n\tbox.bg_color = Color(fill)\n\tbox.border_color = Color(border)\n\tbox.set_border_width_all(1)\n\tbox.set_corner_radius_all(9)\n\treturn box\n\nfunc _style_session_controls() -> void:\n\tif menu_button == null:\n\t\treturn\n\tvar font: Font = preload(\"res://Font/NotoSansMyanmar.ttf\") if language_option.selected == 1 else preload(\"res://Font/NotoSansCJKjp-Regular.otf\")\n\tfor button in [%RestartButton, %ActiveLanguage, menu_button]:\n\t\tbutton.custom_minimum_size = Vector2(100 if button == %ActiveLanguage else 34, 28)\n\t\tbutton.size_flags_vertical = Control.SIZE_SHRINK_CENTER\n\t\tbutton.add_theme_font_override(\"font\", font)\n\t\tbutton.add_theme_font_size_override(\"font_size\", 10 if button == %ActiveLanguage else 12)\n\t\tfor state in [\"normal\", \"hover\", \"pressed\", \"disabled\", \"focus\"]:\n\t\t\tvar fill := \"ffffff\"\n\t\t\tif state in [\"hover\", \"pressed\"]:\n\t\t\t\tfill = \"d8ecff\"\n\t\t\telif state == \"disabled\":\n\t\t\t\tfill = \"edf4fa\"\n\t\t\tvar box := _progress_box(fill, \"167de7\" if state == \"focus\" else \"a7cef4\")\n\t\t\tif state == \"focus\":\n\t\t\t\tbox.draw_center = false\n\t\t\t\tbox.set_border_width_all(2)\n\t\t\tbox.content_margin_left = 7\n\t\t\tbox.content_margin_right = 7\n\t\t\tbox.content_margin_top = 2\n\t\t\tbox.content_margin_bottom = 2\n\t\t\tbutton.add_theme_stylebox_override(state, box)\n\t\tfor state in [\"font_color\", \"font_hover_color\", \"font_pressed_color\", \"font_focus_color\"]:\n\t\t\tbutton.add_theme_color_override(state, Color(\"102e59\"))\n\tstage_header.add_theme_font_override(\"font\", font)\n\tstage_header.add_theme_font_size_override(\"font_size\", 16)\n\tstage_header.add_theme_color_override(\"font_color\", Color(\"102e59\"))\n\tstage_header.add_theme_stylebox_override(\"normal\", StyleBoxEmpty.new())\n\tstage_header.size_flags_vertical = Control.SIZE_SHRINK_CENTER\n\nfunc _refresh_level_selector() -> void:\n\tif level_selector == null:\n\t\treturn\n\tlevel_selector.disabled = highest_level < 2 or busy or not customer.intro_complete\n\tlevel_selector.select(stage)\n\tfor index in range(PLAYABLE_LEVELS):\n\t\tlevel_selector.set_item_disabled(index, not Progress.is_level_unlocked(index + 1))\n\tfor index in range(level_markers.size()):\n\t\tvar marker := level_markers[index]\n\t\tvar active := index == stage\n\t\tvar unlocked := index < PLAYABLE_LEVELS and (active or not level_selector.is_item_disabled(index))\n\t\tmarker.disabled = not unlocked or busy or not customer.intro_complete or active\n\t\tmarker.icon = progress_icons[\"unlocked\" if unlocked else \"locked\"]\n\t\tvar fill := \"104db6\" if active else (\"e7d9c5\" if index == 2 else \"d4e6f8\")\n\t\tvar ink := Color.WHITE if active else Color(\"183f6c\" if unlocked else \"5c6e83\")\n\t\tfor state in [\"normal\", \"hover\", \"pressed\", \"disabled\"]:\n\t\t\tvar box := _progress_box(\"bfdcf5\" if state == \"hover\" and not active else fill, \"aac8e5\")\n\t\t\tbox.set_corner_radius_all(4)\n\t\t\tbox.content_margin_left = 0\n\t\t\tbox.content_margin_right = 0\n\t\t\tif active:\n\t\t\t\tbox.border_color = Color(\"36dafa\")\n\t\t\t\tbox.border_width_bottom = 3\n\t\t\tmarker.add_theme_stylebox_override(state, box)\n\t\tfor state in [\"font_color\", \"font_hover_color\", \"font_pressed_color\", \"font_focus_color\", \"font_disabled_color\"]:\n\t\t\tmarker.add_theme_color_override(state, ink)\n\t\tvar description := _ui(\"\u30ec\u30d9\u30eb %d\", \"\u1021\u1006\u1004\u1037\u103a %d\", \"Level %d\") % (index + 1)\n\t\tif not unlocked:\n\t\t\tdescription += _ui(\"\uff08\u30ed\u30c3\u30af\u4e2d\uff09\", \" (\u1015\u102d\u1010\u103a\u1011\u102c\u1038\u101e\u100a\u103a)\", \" (Locked)\")\n\t\telif index < completed_levels:\n\t\t\tdescription += _ui(\"\uff08\u5b8c\u4e86\uff09\", \" (\u1015\u103c\u102e\u1038\u1005\u102e\u1038)\", \" (Completed)\")\n\t\tmarker.tooltip_text = description\n\t\tmarker.accessibility_name = description\n\nfunc _select_level(index: int) -> void:\n\tif index == 2:\n\t\tif Progress.is_level_unlocked(3) and not busy:\n\t\t\tget_tree().change_scene_to_file(\"res://stage_3.tscn\")\n\t\telse:\n\t\t\t_refresh_level_selector()\n\t\treturn\n\tif busy or index < 0 or index >= PLAYABLE_LEVELS or not Progress.is_level_unlocked(index + 1) or index == stage:\n\t\t_refresh_level_selector()\n\t\treturn\n\tcustomer.settle_after_result()\n\tadvance_pending = false\n\tretry_drawing_pending = false\n\tbusy = false\n\tcurrent.hide()\n\t_show_stage(index, false)\n\tok_button.disabled = false\n\tclear_button.disabled = false\n\tcustomer.clear_conversation()\n\tif index == 0:\n\t\tcanvas.clear_all()\n\t\tfor line in range(customer.intro_line_count()):\n\t\t\tcustomer.conversation.append({\"kind\":\"intro\", \"index\":line})\n\telse:\n\t\tcustomer.conversation.append({\"kind\":\"notice\", \"jp\":stage_questions[index][0], \"my\":stage_questions[index][1]})\n\tcustomer._rebuild_conversation()\n\tcustomer.settle_after_result()\n\t_set_idle()\n\n\nfunc _style_reference_drawing() -> void:\n\tvar reference := %PlanPanel as PanelContainer\n\tvar heading := reference.get_parent().get_n lip_data = _load_json(\"res://assets/voice/my/check_lip.json\", {})\n\tenglish_feedback_lip_data = _load_json(\"res://assets/voice/en/check_lip.json\", {})\n\tmouth_timer.timeout.connect(_animate_mouth)\n\ttimer.timeout.connect(_type_character)\n\tgap_timer.timeout.connect(_after_gap)\n\tvoice.finished.connect(_finish_speaking)\n\tset_language(0)\n\tdialogue.text = \"\"\n\nfunc _load_json(path: String, fallback: Variant) -> Variant:\n\tif FileAccess.file_exists(path):\n\t\tvar data: Variant = JSON.parse_string(FileAccess.get_file_as_string(path))\n\t\tif data != null and typeof(data) == typeof(fallback):\n\t\t\treturn data\n\treturn fallback\n\nfunc set_language(index: int) -> void:\n\tlanguage = clampi(index, 0, 2)\n\tnotice_lip_data = _load_json(_voice_folder() + \"notice_lip.json\", {})\n\tname_label.text = _tr(\"\u7d30\u5ddd\u3055\u3093\uff08\u5973\u6027\uff09\", \"\u101f\u102d\u102f\u1006\u102d\u102f\u1000\u102c\u101d\u102b (\u1021\u1019\u103b\u102d\u102f\u1038\u101e\u1019\u102e\u1038)\")\n\ttitle_label.text = _tr(\"\u304a\u5ba2\u69d8\u306e\u3054\u4f9d\u983c\", \"\u1016\u1031\u102c\u1000\u103a\u101e\u100a\u103a\u104f \u1010\u1031\u102c\u1004\u103a\u1038\u1006\u102d\u102f\u1001\u103b\u1000\u103a\")\n\t_rebuild_conversation()\n\tdialogue.visible_characters = -1\n\n\nfunc switch_language(index: int) -> void:\n\t# Translate the existing conversation and replay only the active line.\n\t# Keep intro position, gap timer, stage callbacks and the drawing untouched.\n\tvar replay: bool = speaking\n\tif replay:\n\t\t_stop_speech()\n\tset_language(index)\n\tif not replay or conversation.is_empty():\n\t\treturn\n\tvar entry: Dictionary = conversation.back()\n\tvar last_text := _message_text(entry)\n\tcurrent_message_start = maxi(0, dialogue.get_total_character_count() - last_text.length() - 1)\n\tdialogue.visible_characters = current_message_start\n\tmatch mode:\n\t\t\"intro\":\n\t\t\t_play(_stage_one_stream(current_line))\n\t\t\"feedback\":\n\t\t\t_play(_feedback_stream())\n\t\t\"notice\":\n\t\t\t_play(_load_voice(notice_audio_key))\n\n# ---------- conversation flow ----------\nfunc begin() -> void:\n\t_stop_speech()\n\tconversation.clear()\n\tintro_complete = false\n\tcurrent_line = 0\n\tplan.hide()\n\tmode = \"intro\"\n\t_speak_intro_line()\n\nfunc _speak_intro_line() -> void:\n\t_append_message({\"kind\": \"intro\", \"index\": current_line})\n\t_play(_stage_one_stream(current_line))\n\n\nfunc intro_line_count() -> int:\n\treturn STAGE_ONE_INTRO_COUNT\n\nfunc _after_gap() -> void:\n\tif mode != \"intro\":\n\t\treturn\n\tif current_line + 1 < intro_line_count():\n\t\tcurrent_line += 1\n\t\t_speak_intro_line()\n\telse:\n\t\tmode = \"idle\"\n\t\t_reveal_plan()\n\t\tintro_complete = true\n\t\tintro_finished.emit()\n\nfunc _reveal_plan() -> void:\n\tplan.show()\n\tplan.modulate.a = 0.0\n\tcreate_tween().tween_property(plan, \"modulate:a\", 1.0, 0.5)\n\nfunc show_result(answer: Dictionary) -> void:\n\t_stop_speech()\n\tgap_timer.stop()\n\tmode = \"feedback\"\n\tfeedback_code = \"correct\" if answer.get(\"ok\", false) else \"incorrect\"\n\t_append_message({\"kind\": \"result\", \"answer\": answer.duplicate(true)})\n\t_play(_feedback_stream())\n\nfunc clear_conversation() -> void:\n\t_stop_speech()\n\tconversation.clear()\n\tcurrent_message_start = 0\n\tdialogue.text = \"\"\n\nfunc say_notice(jp: String, my: String) -> void:\n\t_stop_speech()\n\tgap_timer.stop()\n\tmode = \"notice\"\n\t_append_message({\"kind\": \"notice\", \"jp\": jp, \"my\": my})\n\tnotice_audio_key = _notice_key(jp)\n\t_play(_load_voice(notice_audio_key) if not notice_audio_key.is_empty() else null)\n\n# ---------- speech ----------\nfunc _play(stream: AudioStream) -> void:\n\tspeaking = true\n\tmouth_cycle = 0\n\tspeech_character_count = maxi(1, dialogue.get_total_character_count() - current_message_start)\n\tif stream != null:\n\t\tvoice.stream = stream\n\t\tvoice.pitch_scale = 1.0\n\t\ttimer.stop()\n\t\tvoice.play()\n\telse:\n\t\ttimer.wait_time = 0.018\n\t\tmouth_timer.start()\n\t\ttimer.start()\n\nfunc _update_subtitles(position_sec: float) -> void:\n\tif not conversation.is_empty() and conversation.back()[\"kind\"] == \"ai\":\n\t\tdialogue.visible_characters = -1\n\t\treturn\n\tif voice.stream == null:\n\t\treturn\n\tvar reveal_duration := maxf(0.05, voice.stream.get_length() * subtitle_finish_fraction)\n\tvar progress := clampf(position_sec / reveal_duration, 0.0, 1.0)\n\tdialogue.visible_characters = current_message_start + ceili(float(speech_character_count) * progress)\n\nfunc _type_character() -> void:\n\tdialogue.visible_characters += 1\n\tif dialogue.visible_characters >= dialogue.get_total_character_count():\n\t\ttimer.stop()\n\t\tif not voice.playing:\n\t\t\t_finish_speaking()\n\nfunc _finish_speaking() -> void:\n\tif not speaking:\n\t\treturn\n\tspeaking = false\n\ttimer.stop()\n\tmouth_timer.stop()\n\tvoice.stop()\n\tdialogue.visible_characters = -1\n\n\t_set_mouth(false)\n\tvar finished_mode := mode\n\tif mode == \"intro\":\n\t\tgap_timer.start(maxf(line_gap_sec, [0.24, 0.32, 0.26, 0.18][current_line]))\n\tspeech_finished.emit(finished_mode)\n\nfunc _stop_speech() -> void:\n\tspeaking = false\n\tvoice.stop()\n\ttimer.stop()\n\tmouth_timer.stop()\n\t_set_mouth(false)\n\nfunc _bubble_input(_event: InputEvent) -> void:\n\t# Deliberately disabled: clicks cannot stop or skip instructions.\n\tpass\n\n# ---------- portrait animation ----------\nfunc _process(delta: float) -> void:\n\tmotion_time += delta\n\tvar talking: bool = voice.playing or not timer.is_stopped()\n\tspeaking_strength = move_toward(speaking_strength, 1.0 if talking else 0.0, delta * 4.0)\n\tif portrait.material is ShaderMaterial:\n\t\tportrait.material.set_shader_parameter(\"head_angle\", sin(motion_time * 3.1) * speaking_strength * 0.012)\n\t\tportrait.material.set_shader_parameter(\"viewport_aspect\", portrait.size.x / maxf(1.0, portrait.size.y))\n\tif voice.playing:\n\t\tvar position_sec: float = maxf(0.0, voice.get_playback_position() + AudioServer.get_time_since_last_mix() - AudioServer.get_output_latency())\n\t\t_set_mouth(_mouth_at_position(position_sec))\n\t\t_update_subtitles(position_sec)\n\nfunc _stage_one_voice_key(index: int) -> String:\n\treturn \"%s/%d\" % [[\"jp\", \"mm\", \"en\"][language], index + 1]\n\nfunc _stage_one_stream(index: int) -> AudioStreamMP3:\n\tvar path := STAGE_ONE_VOICE + _stage_one_voice_key(index) + \".mp3\"\n\treturn AudioStreamMP3.load_from_buffer(FileAccess.get_file_as_bytes(path)) if FileAccess.file_exists(path) else null\n\nfunc _feedback_stream() -> AudioStream:\n\tif task_stage == 0:\n\t\treturn _stage_one_stream(4 if feedback_code == \"correct\" else 5)\n\treturn _load_voice(\"check_\" + feedback_code)\n\nfunc _mouth_at_position(position_sec: float) -> bool:\n\tvar entry: Dictionary = {}\n\tif mode == \"intro\":\n\t\tentry = stage_one_lip.get(_stage_one_voice_key(current_line), {})\n\telif mode == \"feedback\" and task_stage == 0:\n\t\tentry = stage_one_lip.get(_stage_one_voice_key(4 if feedback_code == \"correct\" else 5), {})\n\telif mode == \"feedback\":\n\t\tvar feedback: Dictionary = english_feedback_lip_data if language == 2 else (feedback_lip_data if language == 0 else my_feedback_lip_data)\n\t\tentry = feedback.get(feedback_code, {})\n\telif mode == \"notice\":\n\t\tentry = notice_lip_data.get(notice_audio_key, {})\n\tif entry.is_empty():\n\t\treturn int(position_sec * 9.0) % 2 == 0\n\tvar frames: Array = entry.get(\"levels\", [])\n\tvar index: int = int(position_sec / float(entry.get(\"step\", 0.04)))\n\tif index < 0 or index >= frames.size():\n\t\treturn false\n\treturn float(frames[index]) >= 0.18\n\nfunc _set_mouth(opened: bool) -> void:\n\tif portrait.material is ShaderMaterial:\n\t\tportrait.material.set_shader_parameter(\"mouth_open\", 1.0 if opened else 0.0)\n\nfunc _animate_mouth() -> void:\n\tif timer.is_stopped():\n\t\tmouth_timer.stop()\n\t\t_set_mouth(false)\n\t\treturn\n\tmouth_cycle += 1\n\t_set_mouth(mouth_cycle % 5 in [0, 2, 3])\n\n# ---------- text ----------\nfunc _tr(jp: String, my: String) -> String:\n\treturn GameLanguage.text(jp, my, language)\n\nfunc _result_text(answer: Dictionary) -> String:\n\tif language == 2:\n\t\tif answer.get(\"code\", \"\") == \"dimensions\":\n\t\t\tvar actual: Vector2 = answer[\"actual\"]\n\t\t\tvar expected: Vector2 = answer[\"expected\"]\n\t\t\treturn \"Required: %.0f mm wide and %.0f mm high. Current: %.1f mm wide and %.1f mm high.\" % [expected.x, expected.y, actual.x, actual.y]\n\t\tvar messages: Dictionary = {\n\t\t\t\"empty\": \"There are no lines yet. Draw only the blue outline.\",\n\t\t\t\"extra\": \"Remove extra shapes, short lines, duplicate lines, or additional outlines. Keep one outline only.\",\n\t\t\t\"open\": \"Some endpoints are disconnected, or there are extra lines. Join the outline into one closed loop.\",\n\t\t\t\"shape\": \"The outline has no area or contains intersecting lines. Check its shape.\",\n\t\t\t\"corners\": \"The outline must have six corners and a step at the lower right.\",\n\t\t\t\"straight\": \"Some lines are slanted. Make the edges horizontal or vertical.\",\n\t\t\t\"edge_dimensions\": \"The red edges have incorrect lengths or directions.\",\n\t\t\t\"notch\": \"The position or dimensions of the lower-right step are incorrect.\",\n\t\t\t\"correct\": \"Correct. The outline and dimensions match.\"\n\t\t}\n\t\treturn str(messages.get(answer.get(\"code\", \"\"), \"Finish the current line first.\"))\n\tif language == 0:\n\t\treturn answer[\"text\"]\n\tvar messages: Dictionary = {\n\t\t\"empty\": \"\u1019\u103b\u1009\u103a\u1038\u1019\u101b\u103e\u102d\u101e\u1031\u1038\u1015\u102b\u1018\u1030\u1038\u104b \u1021\u1015\u103c\u102c\u101b\u1031\u102c\u1004\u103a \u1018\u1031\u102c\u1004\u103a\u1000\u102d\u102f\u1015\u1032 \u1006\u103d\u1032\u1015\u1031\u1038\u1015\u102b\u104b\",\n\t\t\"extra\": \"\u1021\u1015\u102d\u102f\u1015\u102f\u1036\u104a \u1019\u103b\u1009\u103a\u1038\u1010\u102d\u102f\u104a \u1019\u103b\u1009\u103a\u1038\u1011\u1015\u103a \u101e\u102d\u102f\u1037\u1019\u101f\u102f\u1010\u103a \u1018\u1031\u102c\u1004\u103a\u1021\u1015\u102d\u102f\u101b\u103e\u102d\u1014\u1031\u1015\u102b\u1010\u101a\u103a\u104b \u1018\u1031\u102c\u1004\u103a\u1010\u1005\u103a\u1001\u102f\u1015\u1032 \u1001\u103b\u1014\u103a\u1011\u102c\u1038\u1015\u102b\u104b\",\n\t\t\"open\": \"\u1019\u103b\u1009\u103a\u1038\u1021\u1006\u102f\u1036\u1038\u1010\u103d\u1031 \u1019\u1006\u1000\u103a\u1011\u102c\u1038\u1010\u102c \u101e\u102d\u102f\u1037\u1019\u101f\u102f\u1010\u103a \u1021\u1015\u102d\u102f\u1019\u103b\u1009\u103a\u1038\u101b\u103e\u102d\u1015\u102b\u1010\u101a\u103a\u104b \u1018\u1031\u102c\u1004\u103a\u1000\u102d\u102f \u1021\u1015\u102d\u1010\u103a\u1006\u1000\u103a\u1015\u1031\u1038\u1015\u102b\u104b\",\n\t\t\"shape\": \"\u1019\u103b\u1009\u103a\u1038\u1010\u103d\u1031 \u1016\u103c\u1010\u103a\u1014\u1031\u1015\u102b\u1010\u101a\u103a \u101e\u102d\u102f\u1037\u1019\u101f\u102f\u1010\u103a \u1018\u1031\u102c\u1004\u103a\u1015\u102f\u1036\u1005\u1036 \u1019\u1019\u103e\u1014\u103a\u1015\u102b\u1018\u1030\u1038\u104b\",\n\t\t\"corners\": \"\u1011\u1031\u102c\u1004\u1037\u103a\u1021\u101b\u1031\u1021\u1010\u103d\u1000\u103a \u1019\u103e\u102c\u1038\u1015\u102b\u1010\u101a\u103a\u104b \u1011\u1031\u102c\u1004\u1037\u103a \u1046 \u1001\u102f\u1014\u1032\u1037 \u100a\u102c\u1018\u1000\u103a\u1021\u1031\u102c\u1000\u103a\u1019\u103e\u102c \u1021\u1011\u1005\u103a\u1015\u102b\u101b\u1015\u102b\u1019\u101a\u103a\u104b\",\n\t\t\"straight\": \"\u1019\u103b\u1009\u103a\u1038\u1005\u1031\u102c\u1004\u103a\u1038\u1014\u1031\u1015\u102b\u1010\u101a\u103a\u104b \u1021\u101c\u103b\u102c\u1038\u101c\u102d\u102f\u1000\u103a\u1014\u1032\u1037 \u1012\u1031\u102b\u1004\u103a\u101c\u102d\u102f\u1000\u103a \u1016\u103c\u1031\u102c\u1004\u1037\u103a\u1021\u1031\u102c\u1004\u103a \u1006\u103d\u1032\u1015\u1031\u1038\u1015\u102b\u104b\",\n\t\t\"edge_dimensions\": \"\u1021\u1014\u102e\u101b\u1031\u102c\u1004\u103a\u1019\u103b\u1009\u103a\u1 t\":\n\t\t\tvar color := \"#17633b\" if entry[\"answer\"].get(\"ok\", false) else \"#ad2424\"\n\t\t\ttext = \"[color=%s]%s[/color]\" % [color, text]\n\t\telif entry[\"kind\"] == \"notice\" and entry.get(\"jp\", \"\") == \"\u3061\u3087\u3063\u3068\u3088\u304f\u308f\u304b\u3089\u306a\u3044\u308f\u306d\u3001\u3001\u3001\":\n\t\t\ttext = \"[color=#ad2424]%s[/color]\" % text\n\t\tmessages.append(text if entry[\"kind\"] == \"result\" else \"\u2022 \" + text)\n\tdialogue.text = \"\\n\".join(messages)\n\n# Audio always follows the selected language. Never fall back to another language.\nfunc _voice_folder() -> String:\n\treturn [\"res://assets/voice/\", \"res://assets/voice/my/\", \"res://assets/voice/en/\"][language]\n\nfunc _load_voice(key: String) -> AudioStream:\n\tfor extension in [\"ogg\", \"wav\", \"mp3\"]:\n\t\tvar path: String = _voice_folder() + key + \".\" + extension\n\t\tif ResourceLoader.exists(path):\n\t\t\treturn load(path) as AudioStream\n\treturn null\n\nfunc _notice_key(jp: String) -> String:\n\tmatch jp:\n\t\t\"\u3068\u3053\u308d\u3067\u3001\u56f3\u9762\u306b\u3042\u308bPS\u3063\u3066\u4f55\u3067\u3057\u3087\u3046\u304b\uff1f\":\n\t\t\treturn \"question_ps\"\n\t\t\"\u3061\u3087\u3063\u3068\u3088\u304f\u308f\u304b\u3089\u306a\u3044\u308f\u306d\u3001\u3001\u3001\":\n\t\t\treturn \"answer_retry\"\n\t\t\"\u6b21\u306e\u30b9\u30b1\u30c3\u30c1\u7528\u7d19\u3092\u7528\u610f\u3057\u307e\u3057\u305f\u3002\u3053\u306e\u8ab2\u984c\u306f\u307e\u3060\u6e96\u5099\u4e2d\u3067\u3059\u3002\":\n\t\t\treturn \"stage_3_notice\"\n\t\t\"\u3053\u306e\u8ab2\u984c\u306f\u5b8c\u4e86\u3067\u3059\u3002\u6b21\u306e\u8ab2\u984c\u306f\u307e\u3060\u7528\u610f\u3055\u308c\u3066\u3044\u307e\u305b\u3093\u3002\":\n\t\t\treturn \"check_stage_complete\"\n\treturn \"\"\n\nfunc _request_style(fill: Color, edge: Color) -> StyleBoxFlat:\n\tvar style := StyleBoxFlat.new()\n\tstyle.bg_color = fill\n\tstyle.border_color = edge\n\tstyle.set_border_width_all(1)\n\tstyle.set_corner_radius_all(8)\n\tstyle.content_margin_left = 7\n\tstyle.content_margin_right = 7\n\tstyle.content_margin_top = 4\n\tstyle.content_margin_bottom = 4\n\treturn style\n\nfunc set_result_hint(kind: String, animate: bool = false) -> void:\n\tif request_pulse and request_pulse.is_valid():\n\t\trequest_pulse.kill()\n\trequest_badge.visible = not kind.is_empty()\n\tdialogue.add_theme_stylebox_override(\"normal\", request_base_style)\n\tif kind.is_empty():\n\t\treturn\n\tvar palette: Array = {\n\t\t\"correct\": [\"17633b\", \"e1f7ea\", [\"\u2713 \u6b63\u89e3\", \"\u2713 \u1019\u103e\u1014\u103a\u101e\u100a\u103a\", \"\u2713 Correct\"]],\n\t\t\"incorrect\": [\"ad2424\", \"ffeded\", [\"! \u4e0d\u6b63\u89e3\", \"! \u1019\u103e\u102c\u1038\u101e\u100a\u103a\", \"! Incorrect\"]],\n\t\t\"empty\": [\"8c5908\", \"fff4dd\", [\"! \u672a\u5165\u529b\", \"! \u1016\u103c\u100a\u1037\u103a\u1015\u102b\", \"! Required\"]],\n\t}[kind]\n\tvar ink := Color(palette[0])\n\trequest_badge.text = palette[2][language]\n\trequest_badge.add_theme_color_override(\"font_color\", ink)\n\trequest_badge.add_theme_stylebox_override(\"normal\", _request_style(Color(palette[1]), ink))\n\tvar outline := request_base_style.duplicate() as StyleBoxFlat\n\toutline.border_color = ink\n\tdialogue.add_theme_stylebox_override(\"normal\", outline)\n\tif animate:\n\t\toutline.border_color = ink.lightened(0.55)\n\t\trequest_pulse = create_tween()\n\t\trequest_pulse.tween_property(outline, \"border_color\", ink, 0.22)\n\t\trequest_pulse.tween_property(outline, \"border_color\", ink.lightened(0.55), 0.16)\n\t\trequest_pulse.tween_property(outline, \"border_color\", ink, 0.24)\n\nfunc set_task_stage(index: int) -> void:\n\ttask_stage = index\n\ttitle_label.text = _tr(\"\u304a\u5ba2\u69d8\u306e\u3054\u4f9d\u983c\", \"\u1016\u1031\u102c\u1000\u103a\u101e\u100a\u103a\u104f \u1010\u1031\u102c\u1004\u103a\u1038\u1006\u102d\u102f\u1001\u103b\u1000\u103a\")\n\nfunc clear_service_feedback() -> void:\n\tconversation = conversation.filter(func(entry): return entry[\"kind\"] != \"ai\")\n\t_rebuild_conversation()\n\nfunc settle_after_result() -> void:\n\t_stop_speech()\n\tgap_timer.stop()\n\tmode = \"idle\"\n\tdialogue.visible_characters = -1\n\tspeaking_strength = 0.0\n\tif portrait.material is ShaderMaterial:\n\t\tportrait.material.set_shader_parameter(\"head_angle\", 0.0)\n\n"]]}];
	const table = pack.subarray(directory);
	const view = new DataView(table.buffer, table.byteOffset, table.byteLength);
	const fileBase = Number(new DataView(pack.buffer).getBigUint64(24, true));
	const encoder = new TextEncoder();
	const align = position => Math.ceil(position / 16) * 16;
	let newDirectory = align(directory);
	for (const patch of patches) {
		const offset = fileBase + Number(view.getBigUint64(patch.entryOffset, true));
		const length = Number(view.getBigUint64(patch.entryOffset + 8, true));
		const original = pack.subarray(offset, offset + length);
		const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', original));
		const hashHex = Array.from(hash, byte => byte.toString(16).padStart(2, '0')).join('');
		if (hashHex !== patch.checksum) {
			throw new Error('The game version has changed. Please reload.');
		}
		patch.parts = [];
		let cursor = 0;
		for (const [start, end, text] of patch.edits) {
			patch.parts.push(original.subarray(cursor, start), encoder.encode(text));
			cursor = end;
		}
		patch.parts.push(original.subarray(cursor));
		patch.size = patch.parts.reduce((size, part) => size + part.length, 0);
		patch.offset = newDirectory;
		newDirectory = align(newDirectory + patch.size);
	}
	const result = new Uint8Array(newDirectory + table.length);
	result.set(pack.subarray(0, directory));
	result.set(table, newDirectory);
	const resultView = new DataView(result.buffer);
	resultView.setBigUint64(32, BigInt(newDirectory), true);
	for (const patch of patches) {
		let position = patch.offset;
		for (const part of patch.parts) {
			result.set(part, position);
			position += part.length;
		}
		const entry = newDirectory + patch.entryOffset;
		resultView.setBigUint64(entry, BigInt(patch.offset - fileBase), true);
		resultView.setBigUint64(entry + 8, BigInt(patch.size), true);
		result.set(patch.digest, entry + 16);
	}
	return result.buffer;
}

async function loadApprovedPack(onProgress) {
	const [base, approvedPatch, completePatch] = await Promise.all([
		fetch('approved-base.pck?v=9e67b50'),
		fetch('game-pack-source.txt?v=9e67b50'),
        fetch('level-complete-v4.pack.gz?v=9e67b50')
	]);
	if (!base.ok || !approvedPatch.ok || !completePatch.ok) throw new Error('Game files could not be downloaded. Please reload.');
	const body = base.body.getReader();
	const chunks = [];
	let loaded = 0;
	const size = GODOT_CONFIG.fileSizes['index.pck'];
	for (;;) {
		const {value, done} = await body.read();
		if (done) break;
		chunks.push(value);
		loaded += value.byteLength;
		onProgress(loaded, size);
	}
	const original = new Uint8Array(await new Blob(chunks).arrayBuffer());
	const offset = 61138224;
	const oldHeader = new DataView(original.buffer);
	if (original.length !== size || oldHeader.getBigUint64(32, true) !== BigInt(offset))
		throw new Error('Game files are updating. Please reload.');
	const previousShell = await approvedPatch.text();
	const approvedData = previousShell.match(/data:application\/gzip;base64,([A-Za-z0-9+/=]+)/);
	if (!approvedData) throw new Error('The game pack is incomplete. Please reload.');
	const approvedResponse = await fetch('data:application/gzip;base64,' + approvedData[1]);
	const approved = new Uint8Array(await new Response(approvedResponse.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
	const complete = new Uint8Array(await new Response(completePatch.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
	const approvedDirectory = 62680368;
	const directory = new DataView(complete.buffer).getBigUint64(0, true);
	const pointer = Number(directory) - approvedDirectory;
	const result = new Uint8Array(approvedDirectory + complete.length - 8);
	result.set(original.subarray(0, offset));
	result.set(approved.subarray(0, approvedDirectory - offset), offset);
	result.set(complete.subarray(8, pointer + 8), approvedDirectory);
	result.set(complete.subarray(pointer + 8), Number(directory));
	new DataView(result.buffer).setBigUint64(32, directory, true);
	return applyUiEdits(result, Number(directory));
}

(function () {
	const statusOverlay = document.getElementById('status');
	document.getElementById('status-backdrop').style.backgroundImage = 'url(' + document.getElementById('status-splash').src + ')';
	const statusProgress = document.getElementById('status-progress');
	const loadingControls = document.getElementById('loading-controls');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		loadingControls.style.display = mode === 'progress' ? 'grid' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		const engine = new Engine(GODOT_CONFIG);
		const pack = loadApprovedPack((current, total) => {
			statusProgress.max = total;
			statusProgress.value = current;
		});
		Promise.all([engine.init('index'), pack]).then(([, buffer]) => {
			engine.copyToFS('index.pck', buffer);
			return engine.start({args: ['--main-pack', 'index.pck']});
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
