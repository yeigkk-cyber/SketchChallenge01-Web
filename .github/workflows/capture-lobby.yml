name: Capture lobby comparison
on:
  push:
    branches: [qa/lobby-comparison-b3daec1]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Fetch builds and Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-qa screenshot-qa
          repo=https://yeigkk-cyber.github.io/SketchChallenge01-Web
          cp preview-background.html qa-latest.html
          echo 'edb6ec9f8a66ec1591e357b53b9519d28bef2a66' | diff - <(git hash-object qa-latest.html)

          for file in approved-base.pck game-pack-source.txt level-complete-v4.pack.gz; do
            curl -fsSL --retry 3 "$repo/$file?v=9e67b50" -o "live-qa/$file"
          done
          curl -fsSL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
      - name: Render both builds
        shell: bash
        run: |
          set -euo pipefail
          cat > assemble.cjs <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          (async () => {
           const context = {fetch: async url => url.startsWith('data:') ? fetch(url) : new Response(fs.readFileSync('live-qa/' + url.split('?')[0])), Response, Blob, Uint8Array, DataView, TextEncoder, DecompressionStream, crypto};
           for (const [name, html] of [['live','qa-latest.html']]) {
            const sandbox = vm.createContext({...context});
            const code = fs.readFileSync(html, 'utf8').split('const GODOT_CONFIG')[1].split('(function () {')[0];
            const pack = await vm.runInContext('const GODOT_CONFIG' + code + '\nloadApprovedPack(() => {})', sandbox);
            fs.writeFileSync(name + '-screens.pck', Buffer.from(pack));
           }
          })();
          JS
          node assemble.cjs
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x720x24' timeout 35 ./Godot_v4.7.2-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --main-pack live-screens.pck --script "$PWD/capture-05.gd" -- "$PWD/screenshot-qa"
          test "$(find screenshot-qa -name '*.png' | wc -l)" -eq 3
      - uses: actions/upload-artifact@v7
        with:
          name: lobby-screenshots
          path: screenshot-qa/
          if-no-files-found: error
          retention-days: 3
